# Render Blueprint: one-click deploy of the API (Docker) and the dashboard (static site), both on free plans.
services:
  - type: web
    name: airburden-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false          # set to the dashboard URL, e.g. https://airburden.onrender.com
      - key: IQAIR_API_KEY
        sync: false          # optional: live air-quality panel
      - key: OPENCAGE_API_KEY
        sync: false          # optional: geocoding for the live panel
      - key: NEWS_API_KEY
        sync: false          # optional: health-news panel

  - type: web
    name: airburden
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_BACKEND_URL
        sync: false          # set to the API URL, e.g. https://airburden-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
